<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DahaShop Admin</title><link rel="stylesheet" href="/styles.css"></head><body><header><div class="logo">Daha<span>Shop</span> Admin</div><button class="ghost" onclick="logout()">Logout</button></header><div class="dash"><aside><button onclick="loadDash()">📊 Dashboard</button><button onclick="loadSellers()">🏪 Sellers</button><button onclick="loadOrders()">🛒 Orders</button><button onclick="loadUsers()">👤 Users</button><a href="/" style="display:block;padding:12px">← Store</a></aside><main class="container" id="app"></main></div><script>let token=localStorage.getItem('dahaToken');const app=document.getElementById('app');async function api(u,o={}){o.headers={...(o.headers||{}),'Content-Type':'application/json',Authorization:'Bearer '+token};let r=await fetch(u,o),d=await r.json();if(!r.ok)throw Error(d.error);return d}async function loadDash(){try{let d=await api('/api/admin/stats');app.innerHTML=`<h1>Admin Dashboard</h1><div class="statgrid"><div class="stat">Products<b>${d.products}</b></div><div class="stat">Sellers<b>${d.sellers}</b></div><div class="stat">Customers<b>${d.customers}</b></div><div class="stat">Orders<b>${d.orders}</b></div></div><div class="panel" style="padding:20px;margin-top:18px"><h2>Total Revenue</h2><div class="price">Rs. ${d.revenue.toLocaleString()}</div></div>`}catch(e){alert(e.message);location.href='/'}}async function loadSellers(){let d=await api('/api/admin/sellers');app.innerHTML='<h1>Sellers</h1><div class="panel tablewrap"><table class="table"><tr><th>Shop</th><th>Owner</th><th>Email</th><th>Status</th><th>Action</th></tr>'+d.map(s=>`<tr><td>${s.shop_name}</td><td>${s.name}</td><td>${s.email}</td><td>${s.status}</td><td><select onchange="setSeller(${s.id},this.value)"><option>pending</option><option ${s.status==='approved'?'selected':''}>approved</option><option ${s.status==='blocked'?'selected':''}>blocked</option></select></td></tr>`).join('')+'</table></div>'}async function setSeller(id,status){await api('/api/admin/sellers/'+id,{method:'PUT',body:JSON.stringify({status})});loadSellers()}async function loadOrders(){let d=await api('/api/admin/orders');app.innerHTML='<h1>Orders</h1><div class="panel tablewrap"><table class="table"><tr><th>Order</th><th>Customer</th><th>Total</th><th>Payment</th><th>Status</th><th>Update</th></tr>'+d.map(o=>`<tr><td>#${o.id}</td><td>${o.customer_name}</td><td>Rs. ${o.total.toLocaleString()}</td><td>${o.payment_method}</td><td>${o.order_status}</td><td><select onchange="setOrder(${o.id},this.value)"><option>pending</option><option>processing</option><option>shipped</option><option>delivered</option><option>cancelled</option></select></td></tr>`).join('')+'</table></div>'}async function setOrder(id,status){await api('/api/admin/orders/'+id,{method:'PUT',body:JSON.stringify({status})});loadOrders()}async function loadUsers(){let d=await api('/api/admin/users');app.innerHTML='<h1>Users</h1><div class="panel tablewrap"><table class="table"><tr><th>Name</th><th>Email</th><th>Phone</th><th>Role</th></tr>'+d.map(u=>`<tr><td>${u.name}</td><td>${u.email}</td><td>${u.phone||''}</td><td>${u.role}</td></tr>`).join('')+'</table></div>'}function logout(){localStorage.removeItem('dahaToken');location.href='/'}loadDash();</script></body></html>
