<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DahaShop Seller</title><link rel="stylesheet" href="/styles.css"></head><body><header><div class="logo">Daha<span>Shop</span> Seller</div><button class="ghost" onclick="logout()">Logout</button></header><div class="dash"><aside><button onclick="tab('overview')">📊 Overview</button><button onclick="tab('products')">📦 Products</button><button onclick="tab('orders')">🛒 Orders</button><button onclick="tab('profile')">🏪 Shop Profile</button><a href="/" style="display:block;padding:12px">← Store</a></aside><main class="container" id="app"></main></div><div class="modal" id="modal"><div class="modalbox" id="box"></div></div><script>
let token=localStorage.getItem('dahaToken'),data=null;const app=document.getElementById('app');async function api(u,o={}){o.headers={...(o.headers||{}),'Content-Type':'application/json',Authorization:'Bearer '+token};let r=await fetch(u,o),d=await r.json();if(!r.ok)throw Error(d.error);return d}async function load(){try{data=await api('/api/seller/dashboard');tab('overview')}catch(e){alert(e.message);location.href='/'}}function tab(t){if(t==='overview')app.innerHTML=`<h1>Seller Dashboard</h1><p>Welcome, ${data.seller.shop_name}</p><div class="statgrid"><div class="stat">Products<b>${data.products.length}</b></div><div class="stat">Orders<b>${data.orders.length}</b></div><div class="stat">Sales<b>Rs. ${Number(data.sales).toLocaleString()}</b></div><div class="stat">Status<b>${data.seller.status}</b></div></div><div class="panel" style="padding:20px;margin-top:18px"><h2>Quick actions</h2><button class="primary" onclick="tab('products');openProduct()">+ Add Product</button></div>`;if(t==='products')app.innerHTML=`<div class="toolbar"><div><h1>Products</h1><p>Manage your catalog.</p></div><button class="primary" onclick="openProduct()">+ Add Product</button></div><div class="grid">${data.products.map(p=>`<div class="panel" style="padding:16px"><div style="font-size:45px">${p.image||'🛍️'}</div><h3>${p.name}</h3><div class="price">Rs. ${p.price.toLocaleString()}</div><p>Stock: ${p.stock}</p><button class="danger" onclick="del(${p.id})">Delete</button></div>`).join('')}</div>`;if(t==='orders')app.innerHTML='<h1>Orders</h1><div class="panel tablewrap"><table class="table"><tr><th>Order</th><th>Customer</th><th>Total</th><th>Status</th></tr>'+data.orders.map(o=>`<tr><td>#${o.id}</td><td>${o.customer_name}</td><td>Rs. ${o.total.toLocaleString()}</td><td>${o.order_status}</td></tr>`).join('')+'</table></div>';if(t==='profile')app.innerHTML=`<h1>Shop Profile</h1><div class="panel" style="padding:20px"><label>Shop Name</label><input id="shop" value="${data.seller.shop_name}"><label>Address</label><textarea id="addr">${data.seller.address||''}</textarea><button class="primary" onclick="profile()">Save Profile</button></div>`}
function openProduct(){document.getElementById('box').innerHTML=`<h2>Add Product</h2><label>Name</label><input id="pn"><label>Description</label><textarea id="pd"></textarea><label>Category</label><input id="pc" value="Other"><label>Price</label><input id="pp" type="number"><label>Stock</label><input id="ps" type="number"><label>Image / Emoji</label><input id="pi" placeholder="🎧 or image URL"><button class="primary" onclick="addProduct()">Save Product</button>`;document.getElementById('modal').classList.add('show')}
async function addProduct(){try{await api('/api/seller/products',{method:'POST',body:JSON.stringify({name:pn.value,description:pd.value,category:pc.value,price:pp.value,stock:ps.value,image:pi.value})});document.getElementById('modal').classList.remove('show');data=await api('/api/seller/dashboard');tab('products')}catch(e){alert(e.message)}}async function del(id){if(!confirm('Delete product?'))return;await api('/api/seller/products/'+id,{method:'DELETE'});data=await api('/api/seller/dashboard');tab('products')}async function profile(){await api('/api/seller/profile',{method:'PUT',body:JSON.stringify({shopName:shop.value,address:addr.value})});data=await api('/api/seller/dashboard');alert('Saved')}function logout(){localStorage.removeItem('dahaToken');location.href='/'}load();
</script></body></html>
